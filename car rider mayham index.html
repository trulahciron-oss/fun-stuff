<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pseudo-3D Kart Racer Base (Mobile + Desktop)</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #fff;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #instructions {
            position: absolute;
            top: 10px;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="instructions">KEYBOARD: Arrows | MOBILE: Tap Left/Right to Steer/Drive</div>
<canvas id="gameCanvas" width="480" height="360"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- Game Settings & Variables ---
const player = {
    x: 0,          // Position relative to track center (-1 to 1)
    position: 0,   // Distance along the track
    speed: 0,
    maxSpeed: 12,
    accel: 0.1,
    decel: 0.05,
    steerSpeed: 0.04
};

const opponents = [
    { position: 500,  x: -0.5, speed: 10, color: "#ffeb3b" }, // Yellow Kart
    { position: 1200, x: 0.5,  speed: 11, color: "#4caf50" }  // Green Kart
];

const keys = { ArrowUp: false, ArrowLeft: false, ArrowRight: false };

// --- Track Generation ---
const segments = [];
const segmentLength = 200; 

function addRoad(enter, hold, leave, curve) {
    for (let i = 0; i < enter; i++) segments.push(curve * (i / enter));
    for (let i = 0; i < hold; i++) segments.push(curve);
    for (let i = 0; i < leave; i++) segments.push(curve * (1 - (i / leave)));
}

// Build a loop track: Straight, Right turn, Straight, Sharp Left, Straight
addRoad(100, 100, 100, 0);   // Straight starting line
addRoad(100, 200, 100, 2);   // Gentle Right
addRoad(100, 100, 100, 0);   // Straight
addRoad(50, 150, 50, -4);    // Sharp Left
addRoad(100, 200, 100, 1);   // Subtle Right
addRoad(100, 100, 100, 0);   // Straight back to start

const trackLength = segments.length * segmentLength;

// --- Helper Function (Crucial for reading curves) ---
function getSegment(position) {
    const index = Math.floor(position / segmentLength) % segments.length;
    return segments[index];
}

// --- Input Listeners (Keyboard + Mobile Touch) ---

// 1. Keyboard Controls
window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });

// 2. Mobile Touch Controls
function handleTouch(e) {
    e.preventDefault(); 
    
    // Reset inputs before checking active touches
    keys.ArrowLeft = false;
    keys.ArrowRight = false;
    keys.ArrowUp = false;

    // Loop through all active fingers on the screen
    for (let i = 0; i < e.touches.length; i++) {
        let touchX = e.touches[i].clientX;
        let screenWidth = window.innerWidth;

        // If touching the left 40% of the screen -> Steer Left
        if (touchX < screenWidth * 0.40) {
            keys.ArrowLeft = true;
        } 
        // If touching the right 40% of the screen -> Steer Right
        else if (touchX > screenWidth * 0.60) {
            keys.ArrowRight = true;
        } 
        // If touching the middle 20% -> Just Accelerate
        else {
            keys.ArrowUp = true;
        }
    }

    // Drive while turning if holding down multiple fingers
    if (e.touches.length > 1) {
        keys.ArrowUp = true;
    }
}

function handleTouchEnd(e) {
    if (e.touches.length === 0) {
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        keys.ArrowUp = false;
    } else {
        handleTouch(e);
    }
}

// Attach the touch events
canvas.addEventListener("touchstart", handleTouch, { passive: false });
canvas.addEventListener("touchmove", handleTouch, { passive: false });
canvas.addEventListener("touchend", handleTouch, { passive: false });

// --- Main Game Loop ---
function updateAndRender() {
    // 1. Physics & Movement
    if (keys.ArrowUp) {
        player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
    } else {
        player.speed = Math.max(player.speed - player.decel, 0);
    }

    player.position += player.speed;

    // Apply curve forces
    const currentCurve = getSegment(player.position);
    player.x -= (player.speed / player.maxSpeed) * currentCurve * 0.006;

    if (keys.ArrowLeft) player.x -= player.steerSpeed * (player.speed / player.maxSpeed + 0.1);
    if (keys.ArrowRight) player.x += player.steerSpeed * (player.speed / player.maxSpeed + 0.1);

    player.x = Math.max(Math.min(player.x, 2), -2);

    // 2. Rendering Background (Sky & Grass)
    ctx.fillStyle = "#334"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
    
    ctx.fillStyle = "#141"; 
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    // 3. Rendering the Pseudo-3D Road 
    const cameraHeight = 1000;
    const horizon = canvas.height / 2; 
    let dx = 0; 
    let curCurve = 0;

    for (let i = 0; i < horizon; i++) {
        const screenY = horizon + i; 
        const worldDistance = cameraHeight / (i + 1);
        const worldPos = player.position + worldDistance;
        
        const segmentCurve = getSegment(worldPos);
        curCurve += segmentCurve;
        dx += curCurve * 0.05; 

        const roadWidth = 40000 / worldDistance; 
        const roadCenter = canvas.width / 2 + dx - (player.x * roadWidth);

        const isRumble = Math.floor(worldPos / 40) % 2 === 0;
        const grassColor = isRumble ? "#161" : "#141";
        const roadColor = isRumble ? "#444" : "#4a4a4a";
        const rumbleColor = isRumble ? "#fff" : "#ff0000";

        ctx.fillStyle = grassColor;
        ctx.fillRect(0, screenY, canvas.width, 1);

        ctx.fillStyle = roadColor;
        ctx.fillRect(roadCenter - roadWidth / 2, screenY, roadWidth, 1);

        const rumbleWidth = roadWidth * 0.1;
        ctx.fillStyle = rumbleColor;
        ctx.fillRect(roadCenter - roadWidth / 2 - rumbleWidth, screenY, rumbleWidth, 1);
        ctx.fillRect(roadCenter + roadWidth / 2, screenY, rumbleWidth, 1);
    }

opponents.forEach(npc => {
    // 1. Move the NPC forward
    npc.position += npc.speed;

    // 2. Simple AI: stay within bounds and slightly wander lanes
    if (Math.random() < 0.01) npc.x += (Math.random() - 0.5) * 0.2;
    npc.x = Math.max(Math.min(npc.x, 1), -1);

    // 3. Render if they are in front of the player
    let relativePos = npc.position - player.position;
    if (relativePos > 0 && relativePos < 2000) { // Visible range
        const cameraHeight = 1000;
        
        // Perspective scaling math
        const worldDistance = relativePos;
        const i = (cameraHeight / worldDistance) - 1;
        const screenY = (canvas.height / 2) + i; 
        
        const roadWidth = 40000 / worldDistance;
        // Calculate where the center of the road is at that distance
        // (This makes the NPC follow the track's curves perfectly!)
        const roadCenter = canvas.width / 2 - (player.x * roadWidth); 
        const npcX = roadCenter + (npc.x * roadWidth);
        const npcSize = 30 * (roadWidth / 200); // Scale size by distance

        // Draw the NPC sprite/rectangle
        ctx.fillStyle = npc.color;
        ctx.fillRect(npcX - npcSize/2, screenY - npcSize, npcSize, npcSize);
    }
});

    // 4. Draw Player Kart
    const kartX = canvas.width / 2;
    const kartY = canvas.height - 40;

    ctx.fillStyle = "#e91e63"; 
    ctx.fillRect(kartX - 15, kartY, 30, 15);
    
    ctx.fillStyle = "#000"; 
    ctx.fillRect(kartX - 20, kartY + 5, 6, 12);
    ctx.fillRect(kartX + 14, kartY + 5, 6, 12);
    
    ctx.fillStyle = "#00bcd4"; 
    ctx.beginPath();
    ctx.arc(kartX, kartY - 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // 5. Draw UI
    ctx.fillStyle = "#fff";
    ctx.font = "16px monospace";
    ctx.fillText(`SPEED: ${Math.floor(player.speed * 10)} MPH`, 20, 40);
    ctx.fillText(`DIST: ${Math.floor(player.position)}`, 20, 60);

    requestAnimationFrame(updateAndRender);
}

// Start game
requestAnimationFrame(updateAndRender);
</script>

</body>
</html>
