<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
canvas { border:1px solid rgb(63, 50, 50) }
</style>
</head>
<body>

<div style="font-family: Arial; margin-bottom: 10px;">Press <strong>Space</strong> to Jump | Press <strong>P</strong> to Pause/Unpause</div>
<canvas id="canvas" width="800" height="600"></canvas>

<script>
const c = document.getElementById("canvas")
const ctx = c.getContext("2d")

let x = 200
let y = 100
let vy = -0
let gravity = 0.3 

let pipeX = 800;
let pipeX2 = 1200;

let score = 0;
let isPaused = false; // start spillet i gang

function gameLoop(){

    ctx.clearRect(0,0,c.width,c.height)

    // Handle what happens when the game is paused
    if (isPaused) {
        // Draw the background objects so they stay on screen while paused
        drawEverything();

        // Draw an overlay tint and the pause text over it
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.fillStyle = 'white';
        ctx.font = "40px Arial";
        ctx.fillText("GAME PAUSED", c.width / 2 - 130, c.height / 2);

        requestAnimationFrame(gameLoop);
        return;
    }

    // --- GAME PHYSICS & MOVEMENT (Only runs if NOT paused) ---
    vy += gravity
    y += vy

    // floor collision
    if (y + 40 > c.height){
        y = c.height - 40
        vy = -vy * 0.10;  // endre vei, og miste energi og %
    }

    // move pipes
    pipeX -= 3;
    pipeX2 -= 3;

    // If the pipe goes completely off the left edge, reset it to the right
    if (pipeX < -80){
        pipeX = 800
        score += 1;
    }
    if (pipeX2 < -80){
        pipeX2 = 800
        score += 1;
    }
    
    // Draw all elements on the screen
    drawEverything();

    // Check collision for Pipe 1
    if (checkCollision(pipeX, 250, 400)) {
        alert("Game Over! Your score: " + score);
        document.location.reload(); 
        return; 
    }

    // Check collision for Pipe 2
    if (checkCollision(pipeX2, 250, 500)) {
        alert("Game Over! Your score: " + score);
        document.location.reload(); 
        return; 
    }

    requestAnimationFrame(gameLoop)
}

// Clean helper function to render all visual items safely
function drawEverything() {
    // box
    ctx.fillStyle = 'green';
    ctx.fillRect(x, y, 40, 40)

    // pipes 1
    ctx.fillStyle = 'darkblue';
    ctx.fillRect(pipeX, 0, 50, 250)      // upper pipe
    ctx.fillRect(pipeX , 400, 50, 500)   // lower pipe

    // pipes 2 (FIXED: Corrected spelling and used a real color code)
    ctx.fillStyle = 'blue';
    ctx.fillRect(pipeX2, 0, 50, 250)     // upper pipe
    ctx.fillRect(pipeX2, 500, 50, 500)   // lower pipe   

    // scoreboard (FIXED: Corrected style capitalization)
    ctx.fillStyle = isPaused ? 'white' : 'black';
    ctx.font = '30px Arial';
    ctx.fillText('Score: ' + score, 200, 40)
}

// Keydown listener outside loop
document.addEventListener("keydown", handleKeyDown)

function handleKeyDown(e){
    if(e.code === 'KeyP'){
        isPaused = !isPaused; // Inverts true to false, or false to true
        return;
    }

    if(e.code === "Space") { 
        if (isPaused === false){ // FIXED: Cleaned up double negative logic loop
             vy = -10; // Tweaked slightly for better gameplay flow with 0.3 gravity
        }
    }
}
    
function checkCollision(pipeXCoord, upperHeight, lowerTop) {
    let withinX = (x + 40 > pipeXCoord) && (x < pipeXCoord + 50);
    let hitUpper = (y < upperHeight);
    let hitLower = (y + 40 > lowerTop);
    
    return withinX && (hitUpper || hitLower);
}

// start game
gameLoop()

</script>
</body>
</html>
