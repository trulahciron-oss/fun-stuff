<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pseudo-3D Kart Racer (With AI Opponents)</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #fff;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #instructions {
            position: absolute;
            top: 10px;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="instructions">KEYBOARD: Arrows | MOBILE: Tap Left/Right to Steer/Drive</div>
<canvas id="gameCanvas" width="480" height="360"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- Game Settings & Variables ---
const player = {
    x: 0,          // Position relative to track center (-1 to 1)
    position: 0,   // Distance along the track
    speed: 0,
    maxSpeed: 12,
    accel: 0.1,
    decel: 0.05,
    steerSpeed: 0.04
};

// 🌟 HERE ARE THE OPPONENTS! 
// They live right under the player settings at the top of the script.
const opponents = [
    { position: 400,  x: -0.4, speed: 8.5,  maxSpeed: 9.5,  color: "#4caf50", name: "YOSHI" },  // Green Kart
    { position: 1000, x: 0.4,  speed: 10.0, maxSpeed: 11.0, color: "#ffeb3b", name: "BOWSER" } // Yellow Kart
];

const keys = { ArrowUp: false, ArrowLeft: false, ArrowRight: false };

// --- Track Generation ---
const segments = [];
const segmentLength = 200; 

function addRoad(enter, hold, leave, curve) {
    for (let i = 0; i < enter; i++) segments.push(curve * (i / enter));
    for (let i = 0; i < hold; i++) segments.push(curve);
    for (let i = 0; i < leave; i++) segments.push(curve * (1 - (i / leave)));
}

// Build a loop track: Straight, Right turn, Straight, Sharp Left, Straight
addRoad(100, 100, 100, 0);   // Straight starting line
addRoad(100, 200, 100, 2);   // Gentle Right
addRoad(100, 100, 100, 0);   // Straight
addRoad(50, 150, 50, -4);    // Sharp Left
addRoad(100, 200, 100, 1);   // Subtle Right
addRoad(100, 100, 100, 0);   // Straight back to start

const trackLength = segments.length * segmentLength;

// --- Helper Function ---
function getSegment(position) {
    const index = Math.floor(position / segmentLength) % segments.length;
    return segments[index];
}

// --- Input Listeners (Keyboard + Mobile Touch) ---
window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });

function handleTouch(e) {
    e.preventDefault(); 
    keys.ArrowLeft = false;
    keys.ArrowRight = false;
    keys.ArrowUp = false;

    for (let i = 0; i < e.touches.length; i++) {
        let touchX = e.touches[i].clientX;
        let screenWidth = window.innerWidth;

        if (touchX < screenWidth * 0.40) keys.ArrowLeft = true;
        else if (touchX > screenWidth * 0.60) keys.ArrowRight = true;
        else keys.ArrowUp = true;
    }
    if (e.touches.length > 1) keys.ArrowUp = true;
}

function handleTouchEnd(e) {
    if (e.touches.length === 0) {
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        keys.ArrowUp = false;
    } else {
        handleTouch(e);
    }
}

canvas.addEventListener("touchstart", handleTouch, { passive: false });
canvas.addEventListener("touchmove", handleTouch, { passive: false });
canvas.addEventListener("touchend", handleTouch, { passive: false });


// --- Main Game Loop ---
function updateAndRender() {
    // 1. Player Physics & Movement
    if (keys.ArrowUp) {
        player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
    } else {
        player.speed = Math.max(player.speed - player.decel, 0);
    }

    player.position += player.speed;

    const currentCurve = getSegment(player.position);
    player.x -= (player.speed / player.maxSpeed) * currentCurve * 0.006;

    if (keys.ArrowLeft) player.x -= player.steerSpeed * (player.speed / player.maxSpeed + 0.1);
    if (keys.ArrowRight) player.x += player.steerSpeed * (player.speed / player.maxSpeed + 0.1);

    player.x = Math.max(Math.min(player.x, 2), -2);

    // 2. Update Opponent Positions & Infinite Loop
    opponents.forEach(npc => {
        npc.position += npc.speed;
        
        // If an opponent completes the track loop, teleport them back to start seamlessly
        if (npc.position > trackLength) {
            npc.position -= trackLength;
        }
        // If the player laps them completely, adjust positions so the loop doesn't break
        if (player.position - npc.position > trackLength / 2) {
            npc.position += trackLength;
        }
    });
    
    // Wrap player position around track length for endless looping
    if (player.position > trackLength) player.position -= trackLength;

    // 3. Rendering Background (Sky & Grass)
    ctx.fillStyle = "#334"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
    
    ctx.fillStyle = "#141"; 
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    // 4. Rendering the Pseudo-3D Road 
    const cameraHeight = 1000;
    const horizon = canvas.height / 2; 
    let dx = 0; 
    let curCurve = 0;

    // We keep track of the road centers and widths dynamically for rendering the cars later
    const roadLines = [];

    for (let i = 0; i < horizon; i++) {
        const screenY = horizon + i; 
        const worldDistance = cameraHeight / (i + 1);
        const worldPos = player.position + worldDistance;
        
        const segmentCurve = getSegment(worldPos);
        curCurve += segmentCurve;
        dx += curCurve * 0.05; 

        const roadWidth = 40000 / worldDistance; 
        const roadCenter = canvas.width / 2 + dx - (player.x * roadWidth);

        // Store this scanline's layout data to project our opponents correctly
        roadLines[screenY] = { center: roadCenter, width: roadWidth };

        const isRumble = Math.floor(worldPos / 40) % 2 === 0;
        const grassColor = isRumble ? "#161" : "#141";
        const roadColor = isRumble ? "#444" : "#4a4a4a";
        const rumbleColor = isRumble ? "#fff" : "#ff0000";

        ctx.fillStyle = grassColor;
        ctx.fillRect(0, screenY, canvas.width, 1);

        ctx.fillStyle = roadColor;
        ctx.fillRect(roadCenter - roadWidth / 2, screenY, roadWidth, 1);

        const rumbleWidth = roadWidth * 0.1;
        ctx.fillStyle = rumbleColor;
        ctx.fillRect(roadCenter - roadWidth / 2 - rumbleWidth, screenY, rumbleWidth, 1);
        ctx.fillRect(roadCenter + roadWidth / 2, screenY, rumbleWidth, 1);
    }

    // 5. Render Opponent Karts dynamically based on Perspective
    // We sort them so karts further away are drawn first (preventing overlapping bugs)
    opponents.sort((a, b) => b.position - a.position);

    opponents.forEach(npc => {
        // Calculate distance relative to the player
        let relativePos = npc.position - player.position;
        
        // Handle wrapping distance if they are right across the track loop seam
        if (relativePos < -trackLength / 2) relativePos += trackLength;
        if (relativePos > trackLength / 2) relativePos -= trackLength;

        // Only render the NPC if they are ahead of us and within visual range
        if (relativePos > 0 && relativePos < 2000) {
            const worldDistance = relativePos;
            
            // Turn world distance into a screen line (i)
            const i = Math.floor(cameraHeight / worldDistance);
            const screenY = horizon + i;

            // Make sure the calculated screen line actually exists on our ground area
            if (screenY >= horizon && screenY < canvas.height) {
                const line = roadLines[screenY];
                
                // Calculate their screen center based on their personal lane (npc.x)
                const npcScale = line.width / 200; 
                const npcX = line.center + (npc.x * line.width / 2);
                const sizeW = 30 * npcScale;
                const sizeH = 15 * npcScale;

                // Draw Opponent Kart Body
                ctx.fillStyle = npc.color;
                ctx.fillRect(npcX - sizeW / 2, screenY - sizeH, sizeW, sizeH);

                // Draw Opponent Wheels
                ctx.fillStyle = "#000";
                ctx.fillRect(npcX - sizeW/2 - (2*npcScale), screenY - sizeH + (5*npcScale), 3*npcScale, 8*npcScale);
                ctx.fillRect(npcX + sizeW/2 - (1*npcScale), screenY - sizeH + (5*npcScale), 3*npcScale, 8*npcScale);

                // Draw Opponent Driver Helmet
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(npcX, screenY - sizeH - (2*npcScale), 6 * npcScale, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    });

    // 6. Draw Player Kart (Always stays on top / nearest row)
    const kartX = canvas.width / 2;
    const kartY = canvas.height - 40;

    ctx.fillStyle = "#e91e63"; // Player pink body
    ctx.fillRect(kartX - 15, kartY, 30, 15);
    ctx.fillStyle = "#000"; 
    ctx.fillRect(kartX - 20, kartY + 5, 6, 12);
    ctx.fillRect(kartX + 14, kartY + 5, 6, 12);
    ctx.fillStyle = "#00bcd4"; 
    ctx.beginPath();
    ctx.arc(kartX, kartY - 2, 7, 0, Math.PI * 2);
    ctx.fill();

    // 7. Draw UI
    ctx.fillStyle = "#fff";
    ctx.font = "16px monospace";
    ctx.fillText(`SPEED: ${Math.floor(player.speed * 10)} MPH`, 20, 40);
    ctx.fillText(`POS: ${Math.floor(player.position)}`, 20, 60);

    requestAnimationFrame(updateAndRender);
}

// Start game
requestAnimationFrame(updateAndRender);
</script>

</body>
</html>
